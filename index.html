<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geografías · Atlas de campo</title>
  <meta name="description" content="Módulos de capacitación sobre la geografía de cada país, con mapa interactivo, lecciones, práctica y evaluación.">
  <meta name="theme-color" content="#f3ecdc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3ecdc'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%231c2824' stroke-width='2'/%3E%3Cpath d='M2 16h28' stroke='%23b0301c' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="Ecuador/css/fonts.css">
  <style>
    :root { --paper: #f3ecdc; --ink: #1c2824; --muted: #566159; --rule: rgba(28,40,36,.22); --pencil: #b0301c; --pencil-ink: #8f2412; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.55 'Newsreader', Georgia, serif; min-height: 100vh; display: flex; flex-direction: column; }
    .wrap { width: min(1100px, 100% - 2 * clamp(1rem, 4vw, 3rem)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--ink); padding-block: 1rem; }
    .brand { font: 1.45rem/1 'Instrument Serif', serif; }
    .brand em { color: var(--pencil); }
    main { flex: 1; padding-block: clamp(2.5rem, 8vw, 6rem); }
    .eyebrow { font: 500 .72rem 'DM Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
    h1 { font: 400 clamp(3.4rem, 10vw, 8rem)/.9 'Instrument Serif', serif; letter-spacing: -.02em; margin: 0 0 1.5rem; }
    h1 em { color: var(--pencil); display: block; }
    .lede { font-size: 1.25rem; color: #3b4842; max-width: 34rem; margin: 0 0 3rem; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    li { border-bottom: 1px solid var(--ink); }
    li a { display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 1.25rem; align-items: baseline; padding: 1.4rem .25rem; color: inherit; text-decoration: none; }
    li a:hover { background: rgba(28,40,36,.05); }
    li a:hover .name { color: var(--pencil-ink); }
    .n { font: 3.4rem/.85 'Instrument Serif', serif; color: var(--pencil); }
    .name { font: 400 2.2rem/1 'Instrument Serif', serif; }
    .name small { display: block; font: 400 1rem/1.4 'Newsreader', serif; color: var(--muted); margin-top: .35rem; }
    .go { font: 500 .72rem 'DM Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
    .go::after { content: ' →'; }
    footer { border-top: 1px solid var(--ink); padding-block: 1rem; font: 500 .7rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    :focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
    @media (max-width: 600px) { li a { grid-template-columns: 3rem 1fr; } .go { grid-column: 2; } .n { font-size: 2.6rem; } }
  </style>
</head>
<body>
  <header><div class="wrap"><span class="brand">Atlas de <em>campo</em></span></div></header>
  <main>
    <div class="wrap">
      <p class="eyebrow">Módulos de capacitación</p>
      <h1>Geografías<em>de cada país</em></h1>
      <p class="lede">Mapa interactivo, regiones, lecciones, práctica y evaluación. Un módulo por país.</p>
      <ul>
        <li><a href="Ecuador/"><span class="n">01</span><span class="name">Ecuador<small>Provincias, regiones y capitales · 6 lecciones, 3 juegos y evaluación final</small></span><span class="go">Abrir</span></a></li>
      </ul>
    </div>
  </main>
  <footer><div class="wrap">Límites referenciales con fines educativos</div></footer>
</body>
</html>
